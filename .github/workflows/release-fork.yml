name: Release fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api repos/make-all/tuya-local/releases/latest --jq '.tag_name')"
          echo "Latest upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          git remote add upstream https://github.com/make-all/tuya-local.git
          git fetch upstream "refs/tags/$TAG"

          UPSTREAM_SHA="$(git rev-list -n 1 FETCH_HEAD)"

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "included=true" >> "$GITHUB_OUTPUT"
          else
            echo "included=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create fork release
        if: steps.upstream.outputs.included == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Tuya Local $TAG with Euroster 4040 support."
