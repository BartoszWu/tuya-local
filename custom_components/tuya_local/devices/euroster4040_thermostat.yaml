name: Thermostat
products:
  - id: f8oamfazwp5wo8go
    manufacturer: Euroster
    model: 4040 Smart
    # room thermostat controlling the pump relay
entities:
  - entity: climate
    translation_key: thermostat
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat_cool
      # Preset flags are independent of the low-nibble HVAC action.
      - id: 103
        type: base64
        name: preset_mode
        optional: true
        mask: "500000000000000000000000000000000000"
        mapping:
          - dps_val: 0
            value: program
          - dps_val: 1
            value: temporary_override
          - dps_val: 4
            value: hold
          - value: null
            hidden: true
        write_mapping:
          - value: program
            when: {preset_mode: program}
          - value: temporary_override
            when: {preset_mode: temporary_override}
          - value: hold
            when: {preset_mode: hold}
          - value: program
            when: {preset_mode: temporary_override}
            target: temporary_command
            write_value: "//8="
          - value: program
            when: {preset_mode: hold}
            target: hold_command
            write_value: "//8="
          - value: temporary_override
            target: temporary_command
            value_from: temperature
          - value: hold
            target: hold_command
            value_from: temperature
      # Read DP103; route writes using the reported preset.
      - id: 108
        type: base64
        name: temperature
        optional: true
        decimal_bytes: 1
        range:
          min: 5
          max: 35
        unit: C
        mapping:
          - value_mirror: reported_temperature
            step: 0.1
        write_mapping:
          - when: {preset_mode: program}
            target: temporary_command
          - when: {preset_mode: temporary_override}
            target: temporary_command
          - when: {preset_mode: hold}
            target: hold_command
      - &hold_command
        id: 108
        type: base64
        name: hold_command
        optional: true
        hidden: true
        decimal_bytes: 1
        range: {min: 5, max: 35}
        mapping:
          - step: 0.1
      - &temporary_command
        <<: *hold_command
        id: 109
        name: temporary_command
      - id: 103
        type: base64
        name: reported_temperature
        optional: true
        readonly: true
        hidden: true
        mask: "0000000000000000FFFF0000000000000000"
        decimal_bytes: 1
      - id: 103
        type: base64
        name: current_temperature
        optional: true
        readonly: true
        mask: "00000000000000000000FFFF000000000000"
        decimal_bytes: 1
      - id: 103
        type: base64
        name: hvac_action
        optional: true
        mask: "0F0000000000000000000000000000000000"
        mapping:
          - dps_val: 1
            value: preheating
          - dps_val: 5
            value: heating
          - dps_val: 9
            value: idle
          - dps_val: 13
            value: heating
          - value: idle
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 17
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit

  # HEX Value      2d 02 00 00 00 00 00 02 18 01 14 06 80 00 80 00 08 02
  # Legacy diagnostic entity; the climate now includes this fraction.
  - entity: number
    name: Set temperature decimal
    category: diagnostic
    hidden: true
    dps:
      - id: 103
        type: base64
        name: value
        readonly: true
        optional: true
        mask: "000000000000000000FF0000000000000000"
        mapping:
          - scale: 10

  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 103
        type: base64
        name: sensor
        optional: true
        mask: "0F0000000000000000000000000000000000"
        mapping:
          - dps_val: 7
            value: true
          - value: false
  - entity: button
    # requesting refresh of sensors (dp103)
    name: Update sensors
    icon: "mdi:refresh"
    category: config
    dps:
      - id: 101
        type: boolean
        name: button
        optional: true
  - entity: button
    # request refresh of schedule - hide by default, as schedule not exposed
    # (dp 104 - HEX Value(015555555aaaaaaaaaaaaaaa55170918010000))
    name: Fetch schedule
    icon: "mdi:calendar-sync"
    category: config
    hidden: true
    dps:
      - id: 102
        type: boolean
        name: button
        optional: true
  - entity: button
    name: Resume schedule
    icon: "mdi:calendar-sync"
    dps:
      - id: 108
        type: base64
        name: button
        optional: true
        write_mapping:
          - value: true
            when: {reported_preset: program}
          - value: true
            when: {reported_preset: temporary_override}
            target: temporary_command
            write_value: "//8="
          - value: true
            when: {reported_preset: hold}
            target: hold_command
            write_value: "//8="
      - <<: *hold_command
      - <<: *temporary_command
      - id: 103
        type: base64
        name: reported_preset
        optional: true
        hidden: true
        readonly: true
        mask: "500000000000000000000000000000000000"
        mapping:
          - dps_val: 0
            value: program
          - dps_val: 1
            value: temporary_override
          - dps_val: 4
            value: hold
          - value: null
            hidden: true
