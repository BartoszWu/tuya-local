name: Release fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-fork
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'BartoszWu/tuya-local' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api repos/make-all/tuya-local/releases/latest --jq '.tag_name')"
          echo "Latest upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          git remote add upstream https://github.com/make-all/tuya-local.git
          git fetch upstream "refs/tags/$TAG"

          UPSTREAM_SHA="$(git rev-list -n 1 FETCH_HEAD)"
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "included=true" >> "$GITHUB_OUTPUT"
          else
            echo "included=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create fork release
        if: steps.upstream.outputs.included == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "Main has advanced; let the newer run publish its release."
            exit 0
          fi

          python3 "$GITHUB_WORKSPACE/util/fork_release.py" \
            --upstream-tag "$UPSTREAM_TAG" \
            --upstream-sha "$UPSTREAM_SHA" \
            --source-commit "$GITHUB_SHA"
          TAG="$(cat dist/version.txt)"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable fork release $TAG already exists. Nothing to do."
            exit 0
          fi

          gh release create "$TAG" dist/tuya_local.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Tuya Local $TAG (Euroster fork)" \
            --notes "Upstream $UPSTREAM_TAG with fork fixes at $GITHUB_SHA. Install tuya_local.zip through HACS; its manifest version is $TAG. Includes Euroster program temperatures, weekly schedule reads and verified writes. Existing upstream tags are unchanged."
