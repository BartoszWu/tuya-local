send_learned_ir_command:
  target:
    entity:
      domain: remote
      integration: tuya_local
  fields:
    command:
      required: true
      example: "Play"
      selector:
        object:
    device:
      example: "TV"
      selector:
        text:
    emitter_entity_id:
      example: "infrared.my_ir_emitter"
      required: true
      selector:
        entity:
          filter:
            domain: infrared

refresh_schedule:
  target:
    entity:
      domain: climate
      integration: tuya_local

set_schedule:
  target:
    entity:
      domain: climate
      integration: tuya_local
  fields:
    day:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 7
          step: 1
          mode: box
    periods:
      required: true
      selector:
        object:
    expected_periods:
      required: true
      selector:
        object:

set_program_temperatures:
  target:
    entity:
      domain: climate
      integration: tuya_local
  fields:
    day_temperature:
      selector:
        number:
          min: 5
          max: 35
          step: 0.1
          unit_of_measurement: "°C"
    night_temperature:
      selector:
        number:
          min: 5
          max: 35
          step: 0.1
          unit_of_measurement: "°C"

copy_schedule:
  target:
    entity:
      domain: climate
      integration: tuya_local
  fields:
    source_day:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 7
          step: 1
          mode: box
    target_days:
      required: true
      example: [2, 3, 4, 5]
      selector:
        object:
